name: CI

on:
  pull_request:
    branches: [deployment]
  push:
    branches: [deployment]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q -m "not integration"
        env:
          TEST_DATABASE_URL: postgresql+psycopg://thouq_test:ci@127.0.0.1:5432/thouq_test

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://thouq_test:ci_test@127.0.0.1:5432/thouq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Create disposable test role
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://postgres:ci_admin@127.0.0.1:5432/postgres", autocommit=True) as conn:
              conn.execute("CREATE ROLE thouq_test LOGIN PASSWORD 'ci_test' NOSUPERUSER CREATEDB NOCREATEROLE")
          PY
      - run: python database/reset_test_db.py
      - name: Verify PostgreSQL migrations and persistence
        working-directory: backend
        run: python -m pytest -q -m integration
